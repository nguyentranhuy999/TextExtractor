[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotowire-bench"
version = "0.1.0"
description = "Reproducible GLiNER2 / GPT 5.5 Text-to-Table benchmark"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5", "PyYAML==6.0.3", "openai==2.28.0"]

[project.optional-dependencies]
local = ["gliner2==1.2.4", "gliner==0.2.21", "torch==2.6.0", "transformers==4.51.3", "requests==2.32.5", "urllib3==2.6.3"]
report = ["matplotlib==3.10.8"]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
include = ["rotowire_bench*"]

[tool.setuptools.package-data]
rotowire_bench = ["prompts/*.txt", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real model validation (opt in, never mock performance)"]
